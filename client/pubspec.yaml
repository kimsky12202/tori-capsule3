name: login_test
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter

  
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_unity_widget: ^2022.2.1
  geolocator: ^14.0.2
  image_picker: ^1.2.2
  dio: ^5.9.2
  youtube_explode_dart: ^3.0.5
  path_provider: ^2.1.5
  flame: ^1.37.0
  pocketbase: ^0.23.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.2.3
  camera: ^0.11.0
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

