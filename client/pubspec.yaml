    - assets/images/character/idle/
    - assets/images/character/pickup/
    - assets/images/character/walk/south/
    - assets/images/character/walk/north/
    - assets/images/character/walk/east/
    - assets/images/character/walk/west/
    - assets/images/character/carry/south/
    - assets/images/character/carry/east/
    - assets/images/character/carry/west/

    # 썸네일
    - assets/images/capsule/3D/base/

  fonts:                            
    - family: Workbench
      fonts:
        - asset: assets/fonts/Workbench-Regular.ttf
  
